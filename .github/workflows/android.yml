name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check (informational)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          cp -r android-res/* android/app/src/main/res/
          JAVA_DIR=android/app/src/main/java/io/github/filipembcruz/kova
          mkdir -p $JAVA_DIR
          cp android-src/*.java $JAVA_DIR/
          npx cap sync android

      - name: Set version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KOVA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KOVA_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          KS=keystore/kova-release.jks; PASS=kova-open-source; ALIAS=kova
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/release.jks; KS=/tmp/release.jks; PASS="$KS_PASS"; fi
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 "$IN" aligned.apk
          $BT/apksigner sign --ks "$KS" --ks-key-alias $ALIAS --ks-pass pass:$PASS --key-pass pass:$PASS --out kova.apk aligned.apk
          $BT/apksigner verify --print-certs kova.apk
          cp kova.apk "kova-$VERSION-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kova-apk
          path: kova-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Kova ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: true
          body: |
            📱 **Download:** `kova.apk` below → open it on your Android phone to install.
            Baixe o `kova.apk` abaixo e abra no celular Android para instalar.
          files: |
            kova.apk
            kova-*.apk
